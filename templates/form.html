{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block main %}
<section class="experience-section">
    <div class="container" style="flex-direction: column;">
        <h1>{{ page_title }}</h1>
        <form method="post" action="{{ post_form_url }}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="button">{{ submit_button_text }}</button>
            <a href="{{ cancel_button_url }}" class="button button-secondary">Batal</a>
        </form>
    </div>
</section>
{% endblock %}
